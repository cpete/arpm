[project]
name = "todo-app"
version = "0.1.0"
description = "A simple todo list app built with Plotly Dash."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dash>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["todo_app"]
